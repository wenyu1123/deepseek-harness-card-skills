<details class="cs-memory-table" data-turn="{{N}}">
  <summary>📚 记忆区（长期{{M}}篇｜短期{{k}}篇）</summary>
  <div class="cs-mem-meta">启用后第{{N}}轮 · 本组短期{{k}}/6</div>
  <div class="cs-mem-heading">LTM·长期记忆</div>
  <div class="cs-mem-scroll" tabindex="0"><table class="cs-ltm"><thead><tr><th>No.</th><th>Time</th><th>Scene</th><th>Event</th></tr></thead><tbody>{{LTM_ROWS}}</tbody></table></div>
  <div class="cs-mem-heading">STM·短期记忆</div>
  <div class="cs-mem-scroll" tabindex="0"><table class="cs-stm"><thead><tr><th>No.</th><th>Time</th><th>Scene</th><th>Layer</th><th>Event</th></tr></thead><tbody>{{STM_ROWS}}</tbody></table></div>
  <div class="cs-mem-context"><p><b>本局前提：</b>{{已确认的稳定设置}}</p><p><b>有效事项：</b>{{未完约定及已知期限}}</p><p><b>续写位置：</b>{{时间、地点、在场者、最后动作与待回应事项}}</p></div>
</details>
