<section class="cs-status">
<details class="cs-panel" data-section="world" open><summary><span class="cs-icon">⌖</span><span>世界信息</span><small>此刻</small></summary><div class="cs-panel-body"><dl><dt>时间</dt><dd>{{当前时间}}</dd><dt>地点</dt><dd>{{当前地点}}</dd><dt>环境</dt><dd>{{必要环境}}</dd><dt>局势</dt><dd>{{当前需知的情况}}</dd></dl></div></details>
<details class="cs-panel" data-section="self"><summary><span class="cs-icon">◇</span><span>自身状态</span><small>当前</small></summary><div class="cs-panel-body"><dl><dt>身份</dt><dd>{{简要身份}}</dd><dt>身体</dt><dd>{{身体当前状态}}</dd><dt>随身</dt><dd>{{关键物品与归属}}</dd></dl></div></details>
<details class="cs-panel" data-section="people"><summary><span class="cs-icon">❖</span><span>当前人物</span><small>{{相关人数}}人</small></summary><div class="cs-panel-body">{{NPC条目}}</div></details>
<details class="cs-panel" data-section="threads"><summary><span class="cs-icon">▤</span><span>进行中</span><small>未完</small></summary><div class="cs-panel-body"><ul>{{事项条目}}</ul></div></details>
<details class="cs-panel" data-section="actions"><summary><span class="cs-icon">➜</span><span>下一步</span><small>可选</small></summary><div class="cs-panel-body"><ol>{{行动条目}}</ol></div></details>
</section>
